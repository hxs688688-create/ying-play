<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YING PLAY · CMS 后台</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f3f4f6;font:14px system-ui,-apple-system,sans-serif}.bar{height:64px;border-bottom:1px solid #232832;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:#0d1016ed;backdrop-filter:blur(18px);z-index:5}.brand{font-weight:900;font-size:19px}.brand b{color:#e50914}.wrap{max-width:1250px;margin:auto;padding:22px}.panel{background:#11151c;border:1px solid #242a34;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#171c24;border-radius:12px;padding:17px}.num{font-size:29px;font-weight:900;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button,button{background:#e50914;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.ghost{background:#1b2028}.danger{background:#5f1820}.hide{display:none}.login{max-width:430px;margin:11vh auto}input,textarea,select{width:100%;background:#0d1117;color:#f3f4f6;border:1px solid #303744;border-radius:8px;padding:10px;margin:6px 0 11px;outline:none}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:#aeb5c1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #252b35;font-size:13px;vertical-align:top}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.msg{color:#ff7b85;margin:8px 0}.muted{color:#8e97a5}.searchrow{display:flex;gap:8px}.searchrow input{margin:0}.small{font-size:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:13px}.row{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><header class="bar"><div class="brand">影界 <b>· PLAY CMS</b></div><div><a href="/" style="margin-right:12px">前台</a><button id="logout" class="ghost">退出</button></div></header><main class="wrap"><section id="login" class="panel login"><h2>CMS 管理后台</h2><p class="muted">首次登录可创建管理员；之后使用相同账号登录。</p><label>用户名</label><input id="user" autocomplete="username"><label>密码</label><input id="pass" type="password" autocomplete="current-password"><div id="lm" class="msg"></div><button onclick="login()">登录</button></section><section id="panel" class="hide"><div id="stats" class="grid"></div><div class="tabs" style="margin-top:18px"><button onclick="show('videos')">影视管理</button><button onclick="show('cats')" class="ghost">分类</button><button onclick="show('sources')" class="ghost">播放线路</button><button onclick="show('episodes')" class="ghost">播放集</button><button onclick="show('settings')" class="ghost">站点设置</button></div><div class="panel" id="content"></div></section></main><script>
const $=s=>document.querySelector(s);let token=localStorage.yingAdminToken||'';const H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{...H(),...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#user').value.trim(),password:$('#pass').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.yingAdminToken=token;init()}catch(e){$('#lm').textContent=e.message}}
$('#logout').onclick=()=>{localStorage.removeItem('yingAdminToken');location.reload()};async function init(){if(!token)return;try{const d=await api('/admin/dashboard');$('#login').classList.add('hide');$('#panel').classList.remove('hide');$('#stats').innerHTML=[['影视',d.videos],['分类',d.categories],['线路',d.sources],['播放集',d.episodes]].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');show('videos')}catch{token='';localStorage.removeItem('yingAdminToken')}}
async function show(t){const c=$('#content');c.innerHTML='<div class="muted">加载中…</div>';try{if(t==='videos'){const [d,cats]=await Promise.all([api('/admin/videos'),api('/admin/categories')]);c.innerHTML=`<h2>影视管理</h2><form onsubmit="saveVideo(event)"><div class="row"><div><label>标题 *</label><input id="vt" required></div><div><label>副标题</label><input id="vs"></div><div><label>分类</label><select id="vc"><option value="">未分类</option>${cats.list.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>年份</label><input id="vy" type="number"></div><div><label>地区</label><input id="va"></div><div><label>语言</label><input id="vl"></div><div><label>导演</label><input id="vdirector"></div><div><label>演员</label><input id="vactors"></div><div><label>标签</label><input id="vtags"></div><div><label>备注/更新状态</label><input id="vr"></div><div><label>海报 URL</label><input id="vp"></div><div><label>背景图 URL</label><input id="vb"></div></div><label>简介</label><textarea id="vdesc"></textarea><label>正文/扩展内容</label><textarea id="vcontent"></textarea><button>新增影视</button></form><hr><div class="searchrow"><input id="vsearch" placeholder="搜索影视"><button onclick="show('videos')">刷新</button></div><table><tr><th>ID</th><th>标题</th><th>分类</th><th>年份</th><th>点击</th><th>操作</th></tr>${d.list.map(v=>`<tr><td>${v.id}</td><td>${esc(v.title)}</td><td>${esc(v.category_name||'')}</td><td>${v.year||''}</td><td>${v.hits||0}</td><td><button class="danger" onclick="delVideo(${v.id})">删除</button></td></tr>`).join('')}</table>`}else if(t==='cats'){const d=await api('/admin/categories');c.innerHTML=`<h2>分类管理</h2><form onsubmit="saveCat(event)" class="row"><div><label>名称 *</label><input id="cn" required></div><div><label>slug</label><input id="cs"></div><div><label>排序</label><input id="cso" type="number"></div><button>新增分类</button></form><table><tr><th>ID</th><th>名称</th><th>slug</th><th>排序</th><th>操作</th></tr>${d.list.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.slug)}</td><td>${x.sort}</td><td><button class="danger" onclick="delCat(${x.id})">删除</button></td></tr>`).join('')}</table>`}else if(t==='sources'){const d=await api('/admin/sources');c.innerHTML=`<h2>资源站 / 播放线路</h2><p class="muted small">添加你拥有合法使用权或授权的标准 MacCMS VOD JSON API。保存后可测试接口并分批导入。</p><form onsubmit="saveSource(event)" class="row"><div><label>名称 *</label><input id="sn" required></div><div><label>code *</label><input id="sc" required></div><div><label>Base URL *</label><input id="su" placeholder="https://example.com/api.php/provide/vod" required></div><div><label>优先级</label><input id="sp" type="number" value="0"></div><div><label>备注</label><input id="snotes"></div><button>新增资源站</button></form><table><tr><th>ID</th><th>名称</th><th>code</th><th>优先级</th><th>状态</th><th>操作</th></tr>${d.list.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.base_url||'')}</td><td>${x.priority}</td><td>${x.enabled?'启用':'停用'}</td><td><button onclick="testSource(${x.id})">测试</button> <button class="ghost" onclick="importSource(${x.id})">导入</button> <button class="danger" onclick="delSource(${x.id})">删除</button></td></tr>`).join('')}</table>`}else if(t==='episodes'){const vid=prompt('输入视频 ID');if(!vid)return;const d=await api('/admin/episodes?video_id='+encodeURIComponent(vid));c.innerHTML=`<h2>播放集 · 视频 ${vid}</h2><form onsubmit="saveEp(event,${vid})" class="row"><div><label>线路 ID *</label><input id="ei" type="number" required></div><div><label>集数</label><input id="en" type="number" value="1"></div><div><label>集名</label><input id="ename"></div><div><label>播放地址 *</label><input id="eu" required></div><button>新增播放集</button></form><table><tr><th>ID</th><th>线路</th><th>集数</th><th>集名</th><th>地址</th><th>操作</th></tr>${d.list.map(x=>`<tr><td>${x.id}</td><td>${esc(x.source_name)}</td><td>${x.episode_no}</td><td>${esc(x.name)}</td><td>${esc(x.url)}</td><td><button class="danger" onclick="delEp(${x.id},${vid})">删除</button></td></tr>`).join('')}</table>`}else{const d=await api('/admin/settings');c.innerHTML=`<h2>站点设置</h2><label>站点名称</label><input id="setname" value="${esc(d.settings.site_name||'影界 · PLAY')}"><label>站点副标题</label><input id="setsub" value="${esc(d.settings.site_subtitle||'')}"><button onclick="saveSettings()">保存设置</button>`}}catch(e){c.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}
async function saveVideo(e){e.preventDefault();await api('/admin/videos',{method:'POST',body:JSON.stringify({title:$('#vt').value,subtitle:$('#vs').value,category_id:Number($('#vc').value)||null,year:Number($('#vy').value)||0,area:$('#va').value,language:$('#vl').value,director:$('#vdirector').value,actors:$('#vactors').value,tags:$('#vtags').value,remarks:$('#vr').value,poster:$('#vp').value,backdrop:$('#vb').value,description:$('#vdesc').value,content:$('#vcontent').value})});show('videos')}async function delVideo(id){if(confirm('确认删除影视及其播放集？')){await api('/admin/videos?id='+id,{method:'DELETE'});show('videos')}}async function saveCat(e){e.preventDefault();await api('/admin/categories',{method:'POST',body:JSON.stringify({name:$('#cn').value,slug:$('#cs').value,sort:Number($('#cso').value)||0})});show('cats')}async function delCat(id){if(confirm('确认删除分类？')){await api('/admin/categories?id='+id,{method:'DELETE'});show('cats')}}async function saveSource(e){e.preventDefault();await api('/admin/sources',{method:'POST',body:JSON.stringify({name:$('#sn').value,code:$('#sc').value,base_url:$('#su').value,priority:Number($('#sp').value)||0,notes:$('#snotes').value})});show('sources')}async function delSource(id){if(confirm('确认删除线路及其播放集？')){await api('/admin/sources?id='+id,{method:'DELETE'});show('sources')}}
async function testSource(id){try{const d=await api('/admin/import',{method:'POST',body:JSON.stringify({source_id:id,action:'test'})});alert('接口正常\n总数：'+(d.total||0)+'\n页数：'+(d.pagecount||0)+'\n分类：'+(d.classes||0))}catch(e){alert('测试失败：'+e.message)}}
async function importSource(id){const page=Number(prompt('从第几页开始？','1'));if(!page)return;const pages=Number(prompt('导入多少页？（单次最多20页）','1'));if(!pages)return;try{const d=await api('/admin/import',{method:'POST',body:JSON.stringify({source_id:id,action:'import',page,pages,limit:20})});alert('导入完成\n收到：'+d.summary.received+'\n新增/更新：'+d.summary.imported+'\n失败：'+d.summary.failed);show('videos')}catch(e){alert('导入失败：'+e.message)}}async function saveEp(e,vid){e.preventDefault();await api('/admin/episodes',{method:'POST',body:JSON.stringify({video_id:vid,source_id:Number($('#ei').value),episode_no:Number($('#en').value)||1,name:$('#ename').value,url:$('#eu').value})});show('episodes')}async function delEp(id,vid){if(confirm('确认删除？')){await api('/admin/episodes?id='+id,{method:'DELETE'});const d=await api('/admin/episodes?video_id='+vid);show('episodes')}}async function saveSettings(){await api('/admin/settings',{method:'POST',body:JSON.stringify({site_name:$('#setname').value,site_subtitle:$('#setsub').value})});alert('已保存')}init();
</script></body></html>
