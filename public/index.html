<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="description" content="YING PLAY · MacCMS 风格 Cloudflare D1 影视内容管理与分享平台"><link rel="manifest" href="/manifest.json"><title>YING PLAY · 影视库</title><style>
:root{--bg:#080a0f;--panel:#11151c;--panel2:#171c25;--line:#242a34;--text:#f7f8fa;--muted:#9ca3af;--accent:#e50914;--max:1240px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% -10%,#202532 0,#080a0f 38%);color:var(--text);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(8,10,15,.86);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}.nav{max-width:var(--max);margin:auto;min-height:66px;padding:10px 18px;display:flex;align-items:center;gap:14px}.logo{font-size:22px;font-weight:900;white-space:nowrap}.logo b{color:var(--accent)}.search{flex:1;max-width:640px;margin:auto;display:flex}.search input{flex:1;min-width:0;background:#141820;border:1px solid #2a303a;color:#fff;padding:11px 15px;border-radius:12px 0 0 12px;outline:none}.search button{border:0;background:var(--accent);color:#fff;padding:0 18px;border-radius:0 12px 12px 0;font-weight:800}.navlink{border:1px solid #303642;padding:8px 12px;border-radius:10px;color:#cfd3da}.wrap{max-width:var(--max);margin:auto;padding:24px 18px 70px}.hero{min-height:250px;display:flex;align-items:end;padding:60px 10px 26px;border-radius:20px;overflow:hidden;background:linear-gradient(90deg,rgba(8,10,15,.98),rgba(8,10,15,.58),rgba(8,10,15,.2)),url('/icon.svg') right center/280px no-repeat}.hero h1{font-size:44px;line-height:1.05;margin:0 0 10px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.chip{background:#141820;border:1px solid #2a303a;color:#d8dbe0;border-radius:999px;padding:8px 14px;cursor:pointer}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.card{background:rgba(17,21,28,.92);border:1px solid #202630;border-radius:14px;overflow:hidden;transition:.2s;min-width:0}.card:hover{transform:translateY(-4px);border-color:#3a424f}.poster{aspect-ratio:2/3;background:#161b23;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.ph{height:100%;display:grid;place-items:center;color:#697180}.badge{position:absolute;left:8px;top:8px;background:var(--accent);padding:3px 7px;border-radius:6px;font-size:11px;font-weight:800}.ct{padding:10px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:4px;color:#8f98a6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sectiontitle{margin:30px 0 14px;font-size:22px;font-weight:900}.empty{text-align:center;padding:80px 0;color:#727b89}.detail{position:relative;min-height:72vh;border:1px solid #242a34;border-radius:20px;overflow:hidden}.back{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(25px);transform:scale(1.08);opacity:.27}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080a0f 7%,rgba(8,10,15,.78),rgba(8,10,15,.18)),linear-gradient(0deg,#080a0f,transparent 60%)}.info{position:relative;display:flex;gap:30px;padding:70px 50px}.detailposter{width:260px;aspect-ratio:2/3;object-fit:cover;border-radius:15px;box-shadow:0 20px 70px #0008}.info h1{font-size:42px;margin:10px 0}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#202630;border-radius:7px;padding:5px 9px;color:#d9dde4}.desc{max-width:760px;color:#c8cdd5;line-height:1.85}.playbtn{display:inline-block;background:var(--accent);padding:12px 19px;border-radius:10px;font-weight:900;margin-top:12px}.playerbox{background:#000;border-radius:16px;overflow:hidden;border:1px solid #20242c}.playerbox video{width:100%;display:block;max-height:78vh}.eps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.ep{background:#171c24;border:1px solid #2b313b;color:#ddd;border-radius:9px;padding:9px 12px;cursor:pointer}.ep.active{background:var(--accent);border-color:var(--accent)}.notice{padding:12px 14px;border-radius:10px;background:#151a22;border:1px solid #2a303a;color:#bfc5cf;margin:14px 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.nav{padding:9px 12px}.logo{font-size:18px}.navlink{display:none}.hero{min-height:220px;padding:40px 4px 22px}.hero h1{font-size:31px}.wrap{padding:14px 12px 50px}.grid{grid-template-columns:repeat(3,1fr);gap:10px}.info{display:block;padding:32px 20px}.detailposter{width:155px}.info h1{font-size:30px}.search button{padding:0 13px}}
</style></head><body><header class="top"><div class="nav"><a class="logo" href="/">影界 <b>· PLAY</b></a><form class="search" id="search"><input id="q" autocomplete="off" placeholder="搜索电影、电视剧、动漫、综艺…"><button>搜索</button></form><a class="navlink" href="/admin.html">后台</a></div></header><main class="wrap" id="app"></main><script>
const $=s=>document.querySelector(s),get=async p=>{const r=await fetch('/api'+p);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d};let currentList=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function poster(v){return v.poster?`<img loading="lazy" src="${esc(v.poster)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:'<div class="ph">暂无海报</div>'}
function cards(list){return `<div class="grid">${list.map(v=>`<article class="card"><a href="/?id=${v.id}"><div class="poster">${poster(v)}<div class="ph" style="display:none">暂无海报</div>${v.year?`<span class="badge">${esc(v.year)}</span>`:''}</div><div class="ct"><div class="title">${esc(v.title)}</div><div class="sub">${esc(v.remarks||v.subtitle||v.category_name||'')}</div></div></a></article>`).join('')}</div>`}
async function home(q='',category=''){const app=$('#app');app.innerHTML=`<section class="hero"><div><div class="muted">MACCMS 风格内容管理 · CLOUDFLARE D1</div><h1>发现值得看的内容</h1><div class="muted">YING PLAY · 稳定、简洁、移动端优先</div></div></section><div class="sectiontitle">分类</div><div id="cats" class="toolbar"></div><div class="sectiontitle">${q?'搜索结果':'最新内容'}</div><div id="list" class="empty">加载中…</div>`;try{const c=await get('/categories');$('#cats').innerHTML=`<button class="chip ${!category?'active':''}" onclick="home('${esc(q)}','')">全部</button>`+c.list.map(x=>`<button class="chip ${String(category)===String(x.id)?'active':''}" onclick="home('${esc(q)}','${x.id}')">${esc(x.name)}</button>`).join('');const p=new URLSearchParams();if(q)p.set('q',q);if(category)p.set('category',category);const d=await get('/search?'+p);currentList=d.list;$('#list').innerHTML=d.list.length?cards(d.list):'<div class="empty">没有找到相关内容</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function detail(id){const app=$('#app');try{const v=await get('/detail?id='+encodeURIComponent(id));app.innerHTML=`<section class="detail"><div class="back" style="background-image:url('${esc(v.backdrop||v.poster||'')}')"></div><div class="shade"></div><div class="info">${v.poster?`<img class="detailposter" src="${esc(v.poster)}">`:''}<div><div class="muted">${esc(v.category_name||'未分类')} · ${esc(v.year||'')} ${v.area?'· '+esc(v.area):''}</div><h1>${esc(v.title)}</h1><div class="meta">${[v.director,v.actors,v.language,v.remarks,v.duration].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><p class="desc">${esc(v.description||v.content||'暂无简介')}</p>${v.episodes?.length?`<a class="playbtn" href="/?play=${v.id}">▶ 立即播放</a>`:'<div class="notice">暂无播放集，请在后台添加播放线路和剧集。</div>'}</div></div></section>`}catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function play(id){const app=$('#app');try{const v=await get('/detail?id='+encodeURIComponent(id));const eps=v.episodes||[];app.innerHTML=`<div class="sectiontitle">${esc(v.title)}</div><div class="playerbox"><video id="video" controls playsinline ${eps[0]?.url?`src="${esc(eps[0].url)}"`:''}></video></div><div class="eps">${eps.map((e,i)=>`<button class="ep ${i?'':'active'}" onclick="switchEp('${encodeURIComponent(e.url)}',this)">${esc(e.name||('第'+e.episode_no+'集'))} · ${esc(e.source_name||'线路')}</button>`).join('')}</div><div class="notice">播放地址请使用你拥有合法使用权或授权的内容源。</div><p class="muted">${esc(v.description||'')}</p>`;const video=$('#video');if(video)video.addEventListener('timeupdate',()=>{try{localStorage.setItem('yp-progress-'+id,String(video.currentTime))}catch{}})}catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function switchEp(url,btn){document.querySelectorAll('.ep').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const v=$('#video');v.src=decodeURIComponent(url);v.play().catch(()=>{})}
$('#search').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();history.pushState({},'',q?'/?q='+encodeURIComponent(q):'/');home(q)};window.onpopstate=router;async function router(){const u=new URL(location.href);if(u.searchParams.get('id'))return detail(u.searchParams.get('id'));if(u.searchParams.get('play'))return play(u.searchParams.get('play'));const q=u.searchParams.get('q')||'';$('#q').value=q;home(q,u.searchParams.get('category')||'')}router();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
